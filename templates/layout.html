<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Error Panel{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass">
            <div class="logo">
                <i class="fas fa-triangle-exclamation"></i>
                <span>Error Panel</span>
            </div>
            
            <nav class="nav-links">
                <a href="/dashboard" class="nav-item {% if request.path == '/dashboard' %}active{% endif %}">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/add_user" class="nav-item {% if request.path == '/add_user' %}active{% endif %}">
                    <i class="fas fa-user-plus"></i>
                    <span>Add User</span>
                </a>
                <a href="/users_list" class="nav-item {% if request.path == '/users_list' %}active{% endif %}">
                    <i class="fas fa-users-cog"></i>
                    <span>Manage Users</span>
                </a>
                <a href="/device_logs" class="nav-item {% if request.path == '/device_logs' %}active{% endif %}">
                    <i class="fas fa-mobile-screen-button"></i>
                    <span>Device Logs</span>
                </a>
                <a href="/admin_settings" class="nav-item {% if request.path == '/admin_settings' %}active{% endif %}">
                    <i class="fas fa-gears"></i>
                    <span>Admin Settings</span>
                </a>
            </nav>

            <div style="margin-top: auto;">
                <hr style="opacity: 0.1; margin-bottom: 1.5rem;">
                <a href="/logout" class="nav-item" style="color: #ef4444;">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>System Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="margin-bottom: 2.5rem; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 style="font-size: 2rem; font-weight: 800;">{% block page_title %}Overview{% endblock %}</h1>
                    <p style="color: var(--text-muted);">{% block page_subtitle %}Welcome back to your administration panel.{% endblock %}</p>
                </div>
                <div class="glass" style="padding: 0.5rem 1rem; display: flex; align-items: center; gap: 1rem;">
                    <div style="text-align: right;">
                        <p style="font-size: 0.9rem; font-weight: 600;">Admin Panel</p>
                        <p style="font-size: 0.75rem; color: var(--text-muted);">Database Connected</p>
                    </div>
                    <div style="width: 40px; height: 40px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-user-shield"></i>
                    </div>
                </div>
            </header>

            <div class="animate-fade">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
